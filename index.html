<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Audio | エピソード一覧</title>
    <meta name="description" content="経産省の審議会資料をAIが解析したポッドキャストのエピソード一覧。最新のエネルギー政策の要約と音声を確認できます。">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>

<body class="bg-slate-950 text-slate-50 antialiased selection:bg-sky-500/30">

    <!-- Background Elements -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute top-0 right-0 w-[60%] h-[60%] bg-[#FFB38A]/5 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-0 left-0 w-[60%] h-[60%] bg-[#F26522]/5 blur-[120px] rounded-full"></div>
    </div>

    <header class="sticky top-0 z-50 w-full border-b border-slate-800/50 bg-slate-950/80 backdrop-blur-md">
        <div class="container mx-auto flex h-16 items-center justify-between px-4 sm:px-6">
            <a href="/" class="flex items-center gap-2">
                <div
                    class="h-8 w-8 rounded-lg bg-gradient-to-br from-[#FFB38A] to-[#F26522] flex items-center justify-center shadow-lg shadow-[#F26522]/20">
                    <i data-lucide="zap" class="h-5 w-5 text-white"></i>
                </div>
                <span class="font-outfit text-xl font-bold tracking-tight text-slate-100">Energy Audio</span>
            </a>
            <nav class="hidden md:flex items-center gap-3">
                <a href="/lp#episodes"
                    class="rounded-full bg-white px-4 py-2 text-xs font-bold text-slate-950 hover:bg-[#FFB38A] transition-all shadow-lg shadow-white/5">
                    最新エピソード
                </a>
                <a href="/"
                    class="rounded-full bg-[#FFB38A] px-4 py-2 text-xs font-bold text-slate-950 hover:bg-[#ffd1b8] transition-all shadow-lg shadow-[#FFB38A]/10">
                    エピソード一覧
                </a>
                <a href="/podcast.xml" target="_blank"
                    class="flex items-center gap-2 rounded-full bg-[#F26522] px-4 py-2 text-xs font-bold text-white hover:bg-[#ff7b39] transition-all shadow-lg shadow-[#F26522]/20">
                    <i data-lucide="rss" class="h-3.5 w-3.5"></i> RSS
                </a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 sm:px-6 py-12 md:py-20">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12">
            <div class="space-y-4">
                <h1 class="text-3xl md:text-5xl font-bold font-outfit tracking-tight">エピソード一覧</h1>
                <p class="text-slate-400 max-w-2xl leading-relaxed">経産省・OCCTO等の審議会資料をAIが解析し、要約と音声で配信しています。</p>
            </div>
            <div id="feed-status" class="text-xs font-mono text-slate-500 animate-pulse">Loading feed...</div>
        </div>

        <!-- Episode Grid -->
        <div id="episode-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 overflow-visible">
            <!-- Dynamic Content Load Here -->
        </div>
    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-12 text-slate-500 mt-20">
        <div class="container mx-auto px-4 sm:px-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <p class="text-sm">&copy; 2026 Energy Audio. Intelligence Hub.</p>
                <div class="flex gap-6">
                    <a href="#" class="hover:text-[#FFB38A] transition-colors"><i data-lucide="github"
                            class="h-5 w-5"></i></a>
                    <a href="#" class="hover:text-[#FFB38A] transition-colors"><i data-lucide="twitter"
                            class="h-5 w-5"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Templates & Logic -->
    <script>
        async function loadEpisodes() {
            const grid = document.getElementById('episode-grid');
            const status = document.getElementById('feed-status');

            try {
                const response = await fetch('podcast.xml');
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                const items = Array.from(xmlDoc.querySelectorAll('item')).reverse();

                grid.innerHTML = '';

                items.forEach((item, index) => {
                    const title = item.querySelector('title').textContent;
                    const pubDateRaw = item.querySelector('pubDate').textContent;
                    const originalLink = item.querySelector('link')?.textContent || '#';
                    const pubDate = new Date(pubDateRaw).toLocaleDateString('ja-JP', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    });
                    const description = item.querySelector('description').textContent;
                    const audioUrl = item.querySelector('enclosure').getAttribute('url');

                    // Split description by sections
                    const sections = description.split(/### \d\.\s*/);
                    // sections[0] is usually empty before the first ###
                    // sections[1] -> Podcast Guide
                    // sections[2] -> Major Agenda
                    // sections[3] -> Decisions
                    // sections[4] -> Timeline
                    
                    const formatLines = (text) => {
                        if (!text) return '';
                        return text
                            .replace(/\* \*\*(.*?)\*\*/g, '<li class="text-slate-300 mb-1 ml-4 list-disc">$1</li>')
                            .replace(/\* (.*)/g, '<li class="text-slate-400 mb-1 ml-4 list-disc">$1</li>')
                            .replace(/\n/g, '<br>');
                    };

                    const guideContent = formatLines(sections[1]?.replace(/^.*?\n/, ''));
                    const detailedContent = [sections[2], sections[3], sections[4]]
                        .filter(Boolean)
                        .map((s, i) => {
                            const lines = s.split('\n');
                            const head = lines[0];
                            const body = formatLines(lines.slice(1).join('\n'));
                            return `<div class="mb-4"><h4 class="text-white font-bold mb-2 text-[11px] opacity-80">${head}</h4><div class="opacity-90">${body}</div></div>`;
                        })
                        .join('');

                    // 1. Playback Card
                    const card1 = document.createElement('div');
                    card1.className = 'lp-card group flex flex-col h-[520px] border-l-4 border-l-white/30 relative overflow-hidden';
                    card1.innerHTML = `
                        <div class="flex flex-col h-full text-left scroll-container custom-scrollbar overflow-y-auto pr-2" onscroll="const s=this.closest('.lp-card').querySelector('.scroll-indicator'); if(this.scrollTop + this.offsetHeight >= this.scrollHeight - 10) { s.style.opacity='0'; this.classList.add('is-scrolled'); } else { s.style.opacity='1'; this.classList.remove('is-scrolled'); }">
                            <div class="flex justify-between items-start mb-6">
                                <span class="text-[10px] font-bold text-white/60 tracking-widest uppercase">${pubDate}</span>
                            </div>
                            
                            <div class="mb-8 pb-8 border-b border-slate-800/50">
                                <audio controls class="w-full h-8 opacity-70 hover:opacity-100 transition-opacity">
                                    <source src="${audioUrl}" type="audio/mpeg">
                                </audio>
                            </div>

                            <a href="${originalLink}" target="_blank" class="block group/title">
                                <h3 class="text-lg font-bold text-slate-100 leading-snug group-hover/title:text-white transition-colors">${title}</h3>
                            </a>
                        </div>
                        <div class="scroll-indicator text-white/30"><i data-lucide="chevron-down" class="h-4 w-4"></i></div>
                    `;
                    grid.appendChild(card1);

                    // 2. Guide Card
                    const card2 = document.createElement('div');
                    card2.className = 'lp-card group flex flex-col h-[520px] border-l-4 border-l-[#FFB38A]/50 relative overflow-hidden';
                    card2.innerHTML = `
                        <div class="flex flex-col h-full text-left">
                            <div class="flex items-center gap-2 mb-4 shrink-0">
                                <div class="p-1.5 rounded bg-[#FFB38A]/10 text-[#FFB38A]"><i data-lucide="brain" class="h-3.5 w-3.5"></i></div>
                                <h4 class="text-xs font-bold text-[#FFB38A] uppercase tracking-tighter">ポッドキャスト解説ガイド</h4>
                            </div>
                            <div class="scroll-container custom-scrollbar overflow-y-auto pr-2 text-[13px] text-slate-400 leading-relaxed" onscroll="const s=this.closest('.lp-card').querySelector('.scroll-indicator'); if(this.scrollTop + this.offsetHeight >= this.scrollHeight - 10) { s.style.opacity='0'; this.classList.add('is-scrolled'); } else { s.style.opacity='1'; this.classList.remove('is-scrolled'); }">
                                ${guideContent || 'No guide available.'}
                            </div>
                        </div>
                        <div class="scroll-indicator text-[#FFB38A]/30"><i data-lucide="chevron-down" class="h-4 w-4"></i></div>
                    `;
                    grid.appendChild(card2);

                    // 3. Detailed Info Card
                    const card3 = document.createElement('div');
                    card3.className = 'lp-card group flex flex-col h-[520px] border-l-4 border-l-[#F26522]/50 relative overflow-hidden';
                    card3.innerHTML = `
                        <div class="flex flex-col h-full text-left">
                            <div class="flex items-center gap-2 mb-4 shrink-0">
                                <div class="p-1.5 rounded bg-[#F26522]/10 text-[#F26522]"><i data-lucide="list" class="h-3.5 w-3.5"></i></div>
                                <h4 class="text-xs font-bold text-[#F26522] uppercase tracking-tighter">詳細議題・決定事項</h4>
                            </div>
                            <div class="scroll-container custom-scrollbar overflow-y-auto pr-2 text-[12px] text-slate-400 leading-relaxed" onscroll="const s=this.closest('.lp-card').querySelector('.scroll-indicator'); if(this.scrollTop + this.offsetHeight >= this.scrollHeight - 10) { s.style.opacity='0'; this.classList.add('is-scrolled'); } else { s.style.opacity='1'; this.classList.remove('is-scrolled'); }">
                                ${detailedContent || 'No details available.'}
                            </div>
                        </div>
                        <div class="scroll-indicator text-[#F26522]/30"><i data-lucide="chevron-down" class="h-4 w-4"></i></div>
                    `;
                    grid.appendChild(card3);
                });

                status.textContent = `Updated: ${new Date().toLocaleTimeString()}`;
                status.classList.remove('animate-pulse');
                lucide.createIcons();
            } catch (error) {
                console.error('Error loading podcasts:', error);
                status.textContent = 'Failed to load feed.';
                status.classList.add('text-rose-500');
            }
        }

        window.addEventListener('DOMContentLoaded', loadEpisodes);
        lucide.createIcons();
    </script>

    <style>
        /* Custom scrollbar for summary */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.2);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.4);
        }
    </style>
</body>

</html>
