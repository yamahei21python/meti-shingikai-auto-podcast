<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Audio | METI AI Podcast</title>
    <meta name="description" content="経済産業省の審議会資料をAIで読み解く、エネルギードメイン特化型ポッドキャスト">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-50 antialiased selection:bg-sky-500/30">
    
    <!-- Background Elements -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-sky-500/10 blur-[120px] rounded-full"></div>
        <div class="absolute top-[40%] -right-[10%] w-[35%] h-[35%] bg-emerald-500/10 blur-[120px] rounded-full"></div>
        <div class="absolute -bottom-[10%] left-[20%] w-[50%] h-[50%] bg-indigo-500/5 blur-[120px] rounded-full"></div>
    </div>

    <header class="sticky top-0 z-50 w-full border-b border-slate-800/50 bg-slate-950/80 backdrop-blur-md">
        <div class="container mx-auto flex h-16 items-center justify-between px-4 sm:px-6">
            <div class="flex items-center gap-2">
                <div class="h-8 w-8 rounded-lg bg-gradient-to-br from-sky-500 to-emerald-500 flex items-center justify-center shadow-lg shadow-sky-500/20">
                    <i data-lucide="zap" class="h-5 w-5 text-white"></i>
                </div>
                <span class="font-outfit text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-50 to-slate-400">Energy Audio</span>
            </div>
            <nav class="hidden md:flex items-center gap-8">
                <a href="#episodes" class="text-sm font-medium text-slate-400 hover:text-sky-400 transition-colors">Episodes</a>
                <a href="/feed" class="flex items-center gap-2 rounded-full bg-sky-500/10 px-4 py-1.5 text-sm font-semibold text-sky-400 border border-sky-500/20 hover:bg-sky-500/20 transition-all">
                    <i data-lucide="rss" class="h-4 w-4"></i> RSS Feed
                </a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 sm:px-6 py-12 md:py-24">
        <!-- Hero Section -->
        <section class="flex flex-col md:flex-row items-center gap-12 mb-24">
            <div class="flex-1 space-y-8 animate-in fade-in slide-in-from-bottom-10 duration-1000">
                <div class="inline-flex items-center rounded-full border border-sky-400/20 bg-sky-400/10 px-3 py-1 text-xs font-semibold text-sky-400 tracking-wider uppercase">
                    AI-Driven Energy Insights
                </div>
                <h1 class="font-outfit text-5xl md:text-7xl font-bold leading-tight tracking-tighter">
                    審議会の議論を、<br>
                    <span class="text-sky-400">耳から</span>読み解く。
                </h1>
                <p class="max-w-[600px] text-lg md:text-xl text-slate-400 leading-relaxed font-light">
                    経済産業省のエネルギー政策審議会を NotebookLM が徹底解析。複雑な専門議論のポイントを、いつでもどこでもポッドキャスト形式でチェック。
                </p>
                <div class="flex flex-col sm:flex-row gap-4 pt-4">
                    <a href="https://music.youtube.com" target="_blank" class="flex items-center justify-center gap-3 rounded-xl bg-slate-50 px-8 py-4 text-sm font-bold text-slate-950 hover:bg-sky-400 transition-all shadow-xl shadow-sky-500/10">
                        <i data-lucide="play-circle" class="h-5 w-5"></i> YouTube Music で聴く
                    </a>
                    <a href="/feed" class="flex items-center justify-center gap-3 rounded-xl border border-slate-800 bg-slate-900/50 px-8 py-4 text-sm font-bold text-slate-200 hover:border-slate-700 transition-all backdrop-blur-sm">
                        <i data-lucide="rss" class="h-5 w-5"></i> RSSを購読する
                    </a>
                </div>
            </div>
            <div class="flex-1 relative animate-in fade-in zoom-in duration-1000 delay-200">
                <div class="relative z-10 mx-auto aspect-square w-full max-w-[400px] rounded-3xl overflow-hidden shadow-2xl shadow-sky-500/20 border border-slate-800">
                    <img src="cover.png" alt="Energy Audio Cover" class="w-full h-full object-cover">
                </div>
                <!-- Decorative Orbit -->
                <div class="absolute -top-4 -right-4 w-24 h-24 bg-emerald-500/30 blur-2xl rounded-full animate-pulse"></div>
                <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-sky-500/20 blur-3xl rounded-full"></div>
            </div>
        </section>

        <!-- Episode List Section -->
        <section id="episodes" class="space-y-12">
            <div class="flex items-center justify-between border-b border-slate-800 pb-8">
                <h2 class="font-outfit text-3xl font-bold tracking-tight">Recent Episodes</h2>
                <div class="flex items-center gap-2 text-sm text-slate-500">
                    <i data-lucide="list-filter" class="h-4 w-4"></i> Latest Update: <span id="last-update">--</span>
                </div>
            </div>

            <div id="episode-grid" class="grid gap-6 md:grid-cols-2 lg:grid-cols-2">
                <!-- Skeleton Loading -->
                <div class="rounded-2xl border border-slate-800 bg-slate-900/40 p-6 space-y-4 animate-pulse">
                    <div class="h-4 w-1/4 bg-slate-800 rounded"></div>
                    <div class="h-8 w-3/4 bg-slate-800 rounded"></div>
                    <div class="space-y-2">
                        <div class="h-4 w-full bg-slate-800 rounded"></div>
                        <div class="h-4 w-5/6 bg-slate-800 rounded"></div>
                    </div>
                </div>
                <div class="rounded-2xl border border-slate-800 bg-slate-900/40 p-6 space-y-4 animate-pulse">
                    <div class="h-4 w-1/4 bg-slate-800 rounded"></div>
                    <div class="h-8 w-3/4 bg-slate-800 rounded"></div>
                    <div class="space-y-2">
                        <div class="h-4 w-full bg-slate-800 rounded"></div>
                        <div class="h-4 w-5/6 bg-slate-800 rounded"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-12 text-slate-500">
        <div class="container mx-auto px-4 sm:px-6 text-center space-y-4">
            <p class="text-sm">&copy; 2026 Energy Audio. Generated by AI for Energy Professionals.</p>
            <div class="flex justify-center gap-6">
                <a href="#" class="hover:text-sky-400 transition-colors"><i data-lucide="github" class="h-5 w-5"></i></a>
                <a href="#" class="hover:text-sky-400 transition-colors"><i data-lucide="twitter" class="h-5 w-5"></i></a>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
