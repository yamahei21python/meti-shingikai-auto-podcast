<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Audio | エピソード一覧</title>
    <meta name="description" content="経産省の審議会資料をAIが解析したポッドキャストのエピソード一覧。最新のエネルギー政策の要約と音声を確認できます。">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>

<body class="bg-slate-950 text-slate-50 antialiased selection:bg-orange-500/30">

    <!-- Background Elements -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute top-0 right-0 w-[60%] h-[60%] bg-[#FFB38A]/5 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-0 left-0 w-[60%] h-[60%] bg-[#F26522]/5 blur-[120px] rounded-full"></div>
    </div>

    <header class="sticky top-0 z-50 w-full border-b border-slate-800/50 bg-slate-950/80 backdrop-blur-md">
        <div class="container mx-auto flex h-16 items-center justify-between px-4 sm:px-6">
            <a href="/" class="flex items-center gap-2">
                <div
                    class="h-8 w-8 rounded-lg bg-gradient-to-br from-[#FFB38A] to-[#F26522] flex items-center justify-center shadow-lg shadow-[#F26522]/20">
                    <i data-lucide="zap" class="h-5 w-5 text-white"></i>
                </div>
                <span class="font-outfit text-xl font-bold tracking-tight text-slate-100">Energy Audio</span>
            </a>
            <nav class="hidden md:flex items-center gap-3">
                <a href="/lp#episodes"
                    class="rounded-full bg-white px-4 py-2 text-xs font-bold text-slate-950 hover:bg-[#FFB38A] transition-all shadow-lg shadow-white/5">
                    最新エピソード
                </a>
                <a href="/"
                    class="rounded-full bg-[#FFB38A] px-4 py-2 text-xs font-bold text-slate-950 hover:bg-[#ffd1b8] transition-all shadow-lg shadow-[#FFB38A]/10">
                    エピソード一覧
                </a>
                <a href="/podcast.xml" target="_blank"
                    class="flex items-center gap-2 rounded-full bg-[#F26522] px-4 py-2 text-xs font-bold text-white hover:bg-[#ff7b39] transition-all shadow-lg shadow-[#F26522]/20">
                    <i data-lucide="rss" class="h-3.5 w-3.5"></i> RSS
                </a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 sm:px-6 py-12 md:py-20 max-w-6xl">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-16">
            <div class="space-y-4">
                <h1 class="text-3xl md:text-5xl font-bold font-outfit tracking-tight">エピソード一覧</h1>
                <p class="text-slate-400 max-w-2xl leading-relaxed">経産省・OCCTO等の審議会資料をAIが解析し、要約と音声で配信しています。</p>
            </div>
            <div id="feed-status" class="text-xs font-mono text-slate-500 animate-pulse">Synchronizing feed...</div>
        </div>

        <!-- Timeline Container -->
        <div id="timeline-root" class="timeline-container min-h-[400px]">
            <!-- Dynamic Content Load Here -->
        </div>
        
        <!-- Loading State & Pagination -->
        <div id="load-more-container" class="mt-12 flex justify-center pb-20 overflow-visible">
            <button id="load-more-btn" class="hidden flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/50 px-8 py-3 text-sm font-bold text-slate-300 hover:bg-slate-800 hover:text-white transition-all backdrop-blur-sm">
                <span>さらに過去のエピソードを読み込む</span>
                <i data-lucide="chevron-down" class="h-4 w-4"></i>
            </button>
            <div id="end-of-feed" class="hidden text-slate-600 text-sm font-medium tracking-wide italic">
                All episodes loaded.
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-12 text-slate-500">
        <div class="container mx-auto px-4 sm:px-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <p class="text-sm">&copy; 2026 Energy Audio. Intelligence Hub.</p>
                <div class="flex gap-6">
                    <a href="#" class="hover:text-[#FFB38A] transition-colors"><i data-lucide="github"
                            class="h-5 w-5"></i></a>
                    <a href="#" class="hover:text-[#FFB38A] transition-colors"><i data-lucide="twitter"
                            class="h-5 w-5"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Templates & Logic -->
    <script>
        let allItems = [];
        let currentIndex = 0;
        const BATCH_SIZE = 10;
        
        async function initFeed() {
            const root = document.getElementById('timeline-root');
            const status = document.getElementById('feed-status');

            try {
                const response = await fetch('podcast.xml');
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                allItems = Array.from(xmlDoc.querySelectorAll('item')).reverse();

                root.innerHTML = '';
                currentIndex = 0;
                
                if (allItems.length > 0) {
                    renderNextBatch();
                } else {
                    root.innerHTML = '<div class="text-center py-20 text-slate-500">No episodes found.</div>';
                    status.textContent = 'No content.';
                }

                status.textContent = `Updated: ${new Date().toLocaleTimeString()}`;
                status.classList.remove('animate-pulse');
            } catch (error) {
                console.error('Error loading podcasts:', error);
                status.textContent = 'Failed to load feed.';
                status.classList.add('text-rose-500');
            }
        }

        function renderNextBatch() {
            const root = document.getElementById('timeline-root');
            const batch = allItems.slice(currentIndex, currentIndex + BATCH_SIZE);
            
            batch.forEach((item, batchIdx) => {
                const absoluteIndex = currentIndex + batchIdx;
                const title = item.querySelector('title').textContent;
                const pubDateRaw = item.querySelector('pubDate').textContent;
                const originalLink = item.querySelector('link')?.textContent || '#';
                const pubDate = new Date(pubDateRaw).toLocaleDateString('ja-JP', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });
                const description = item.querySelector('description').textContent;
                const audioUrl = item.querySelector('enclosure').getAttribute('url');

                const sections = description.split(/### \d\.\s*/);
                
                const formatLines = (text) => {
                    if (!text) return '';
                    return text
                        .replace(/\* \*\*(.*?)\*\*/g, '<li class="text-slate-300 mb-0 ml-1 list-disc">$1</li>')
                        .replace(/\* (.*)/g, '<li class="text-slate-400 mb-0 ml-1 list-disc">$1</li>')
                        .replace(/\n/g, '<br>');
                };

                const guideContent = formatLines(sections[1]?.replace(/^.*?\n/, ''));
                const detailedContent = [sections[2], sections[3], sections[4]]
                    .filter(Boolean)
                    .map((s) => {
                        const lines = s.split('\n');
                        const head = lines[0];
                        const body = formatLines(lines.slice(1).join('\n'));
                        return `<div class="mb-1"><h4 class="text-white font-bold mb-0 text-[12px]">${head}</h4><div>${body}</div></div>`;
                    })
                    .join('');

                const isLatest = absoluteIndex === 0;
                const itemElement = document.createElement('div');
                itemElement.className = 'timeline-item';
                itemElement.innerHTML = `
                    <div class="timeline-dot"></div>
                    
                    <!-- Main Summary Card -->
                    <div class="lp-card group p-4 md:p-5 flex flex-col md:flex-row items-start md:items-center gap-6 border-l-4 border-l-white/30 backdrop-blur-sm">
                        <div class="flex-1 w-full sm:w-auto">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-[10px] font-bold text-white/50 tracking-widest uppercase">${pubDate}</span>
                                <span class="h-1 w-1 rounded-full bg-white/20"></span>
                                <a href="${originalLink}" target="_blank" class="text-[10px] font-bold text-sunset-peach uppercase tracking-widest hover:underline whitespace-nowrap">Original Link</a>
                            </div>
                            <h3 class="text-xl md:text-2xl font-bold text-slate-100 leading-tight mb-4 group-hover/title:text-white transition-colors">${title}</h3>
                            
                            <div class="flex flex-wrap items-center gap-3">
                                <div class="flex-1 min-w-[200px]">
                                    <audio controls class="w-full h-8 opacity-70 hover:opacity-100 transition-opacity">
                                        <source src="${audioUrl}" type="audio/mpeg">
                                    </audio>
                                </div>
                                <button class="expand-btn shrink-0 ${isLatest ? 'is-open' : ''} py-1.5 px-3" onclick="toggleAccordion(this)">
                                    <i data-lucide="${isLatest ? 'minus-circle' : 'plus-circle'}" class="h-3.5 w-3.5"></i>
                                    <span class="text-xs">詳細確認</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Accordion Expansion Area -->
                    <div class="accordion-content ${isLatest ? 'is-open' : ''}">
                        <div class="accordion-inner">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                <div class="lp-card group flex flex-col h-[600px] border-l-4 border-l-[#FFB38A]/50 relative overflow-hidden bg-slate-900/50 shadow-2xl">
                                    <div class="flex flex-col h-full text-left p-2">
                                        <div class="flex items-center gap-1 mb-1 shrink-0">
                                            <div class="p-1 rounded bg-[#FFB38A]/10 text-[#FFB38A]"><i data-lucide="brain" class="h-3 w-3"></i></div>
                                            <h4 class="text-[10px] font-bold text-[#FFB38A] uppercase tracking-widest">解説ガイド</h4>
                                        </div>
                                        <div class="scroll-container custom-scrollbar overflow-y-auto pr-1 text-[14px] text-slate-400 leading-tight" onscroll="handleScroll(this)">
                                            ${guideContent || 'No guide available.'}
                                        </div>
                                    </div>
                                    <div class="scroll-indicator text-[#FFB38A]/30"><i data-lucide="chevron-down" class="h-3 w-3"></i></div>
                                </div>

                                <div class="lp-card group flex flex-col h-[600px] border-l-4 border-l-[#F26522]/50 relative overflow-hidden bg-slate-900/50 shadow-2xl">
                                    <div class="flex flex-col h-full text-left p-2">
                                        <div class="flex items-center gap-1 mb-1 shrink-0">
                                            <div class="p-1 rounded bg-[#F26522]/10 text-[#F26522]"><i data-lucide="list" class="h-3 w-3"></i></div>
                                            <h4 class="text-[10px] font-bold text-[#F26522] uppercase tracking-widest">議題・決定事項</h4>
                                        </div>
                                        <div class="scroll-container custom-scrollbar overflow-y-auto pr-1 text-[14px] text-slate-400 leading-tight" onscroll="handleScroll(this)">
                                            ${detailedContent || 'No details available.'}
                                        </div>
                                    </div>
                                    <div class="scroll-indicator text-[#F26522]/30"><i data-lucide="chevron-down" class="h-3 w-3"></i></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                root.appendChild(itemElement);
            });
            
            currentIndex += batch.length;
            updatePaginationUI();
            lucide.createIcons();
        }

        function updatePaginationUI() {
            const btn = document.getElementById('load-more-btn');
            const endMsg = document.getElementById('end-of-feed');
            
            if (currentIndex >= allItems.length) {
                btn.classList.add('hidden');
                endMsg.classList.remove('hidden');
            } else {
                btn.classList.remove('hidden');
                endMsg.classList.add('hidden');
            }
        }

        function toggleAccordion(btn) {
            const accordion = btn.closest('.timeline-item').querySelector('.accordion-content');
            const isOpen = accordion.classList.contains('is-open');
            accordion.classList.toggle('is-open');
            btn.classList.toggle('is-open');
            const icon = btn.querySelector('i');
            icon.setAttribute('data-lucide', isOpen ? 'plus-circle' : 'minus-circle');
            lucide.createIcons();
        }

        function handleScroll(el) {
            const indicator = el.closest('.lp-card').querySelector('.scroll-indicator');
            if (el.scrollTop + el.offsetHeight >= el.scrollHeight - 10) {
                indicator.style.opacity = '0';
            } else {
                indicator.style.opacity = '1';
            }
        }

        // Infinite Scroll Observer
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && currentIndex < allItems.length) {
                renderNextBatch();
            }
        }, { threshold: 0.1 });

        window.addEventListener('DOMContentLoaded', () => {
            initFeed();
            document.getElementById('load-more-btn').addEventListener('click', renderNextBatch);
            observer.observe(document.getElementById('load-more-container'));
        });
    </script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.01); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--sunset-orange); }
        
        .scroll-container {
            mask-image: linear-gradient(to bottom, transparent, black 5px, black calc(100% - 10px), transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 5px, black calc(100% - 10px), transparent);
            padding: 5px 0;
        }
    </style>
</body>

</html>
