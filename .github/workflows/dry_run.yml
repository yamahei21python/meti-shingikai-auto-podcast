name: Pipeline Dry Run (5 items + 120s cooldown)

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Setup Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install libcurl-dev (for curl-cffi)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

      - name: Connect WARP (Proxy Mode)
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 5
          echo "SOCKS5_PROXY=socks5://127.0.0.1:40000" >> $GITHUB_ENV

      - name: Setup Dependencies
        working-directory: notebooklm-podcast-lab
        run: uv sync

      - name: Pipeline Dry Run (5 items + 120s cooldown)
        working-directory: notebooklm-podcast-lab
        run: |
          uv run python -c "
          import sys, os, sqlite3, time
          sys.path.insert(0, '.')
          from shared import NetworkClient, DB_PATH, sanitize_filename, setup_logging
          from urllib.parse import urljoin
          from pathlib import Path
          setup_logging()

          # Get 15 pending items (bypass category filter)
          conn = sqlite3.connect(str(DB_PATH))
          conn.row_factory = sqlite3.Row
          c = conn.cursor()
          c.execute('SELECT id, title, url, date, category1 FROM council_updates WHERE podcast_status = \"pending\" ORDER BY date DESC, id DESC LIMIT 5')
          items = [(r['id'], r['title'], r['url'], r['date'], r['category1']) for r in c.fetchall()]
          conn.close()

          print(f'=== Pipeline Dry Run: {len(items)} items (120s cooldown) ===')
          print()

          client = NetworkClient()
          temp_dir = Path('temp_pdfs')
          temp_dir.mkdir(exist_ok=True)

          ok_page = 0
          ok_pdf_extract = 0
          ok_pdf_dl = 0
          ng_page = 0
          ng_pdf = 0

          for idx, item in enumerate(items):
              # 120s cooldown between items (WAF mitigation)
              if idx > 0:
                  print(f'    ... waiting 120s (WAF cooldown) ...')
                  time.sleep(120)

              item_id, title, url, date_str, cat1 = item
              print(f'[{item_id:4d}] {cat1} | {title[:55]}')

              # Fetch page
              soup = client.fetch_soup(url)
              if not soup:
                  print(f'      ❌ Page fetch FAILED')
                  ng_page += 1
                  continue
              ok_page += 1

              # Extract PDFs
              links = soup.find_all('a', href=True)
              pdf_urls = list(dict.fromkeys(
                  urljoin(url, href) for href in [l.get('href','') for l in links]
                  if href.lower().endswith('.pdf') or '/pdf/' in href.lower()
              ))
              if not pdf_urls:
                  print(f'      ⚠️ Page OK ({len(str(soup))} chars) but 0 PDF links')
                  continue
              ok_pdf_extract += 1

              # Download first PDF
              test_url = pdf_urls[0]
              resp = client.fetch(test_url, timeout=30)
              if resp and resp.status_code == 200 and len(resp.content) > 1024:
                  ok_pdf_dl += 1
                  kb = len(resp.content) // 1024
                  print(f'      ✅ page:{len(str(soup)):>5} chars | {len(pdf_urls)} PDFs | DL: {kb}KB')
              else:
                  ng_pdf += 1
                  status = resp.status_code if resp else 'None'
                  print(f'      ❌ page OK but PDF download failed (status={status})')

          client.close()

          # Cleanup
          for f in temp_dir.glob('*.pdf'):
              f.unlink()
          try:
              temp_dir.rmdir()
          except:
              pass

          print()
          print(f'=== Summary ===')
          print(f'  Total:       {len(items)}')
          print(f'  Page OK:     {ok_page} / {len(items)}')
          print(f'  PDF found:   {ok_pdf_extract} / {len(items)}')
          print(f'  PDF DL OK:   {ok_pdf_dl} / {len(items)}')
          if ng_page > 0:
              print(f'  Page FAILED: {ng_page}')
          if ng_pdf > 0:
              print(f'  PDF FAILED:  {ng_pdf}')
          if ok_page == len(items) and ok_pdf_dl == len(items):
              print('  ✅ ALL PASSED')
          else:
              print('  ⚠️ SOME FAILURES - see above')
          " 2>&1 | tee dry_run_output.log
