name: Test Python Sync Script (Isolated)

on:
  workflow_dispatch: # 手動実行専用

jobs:
  test-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Setup Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup Lab (Install dependencies)
        working-directory: notebooklm-podcast-lab
        run: |
          uv sync
          uv run playwright install --with-deps chromium

      - name: Run Python Sync Test
        run: |
          # 隔離フォルダのPython版Syncスクリプトを実行
          # このスクリプトはシミュレーションモードで動作し、本編プロジェクトの環境を使用します
          uv run --project notebooklm-podcast-lab python3 test_scripts/sync_meti.py

      - name: Check Isolation (Ensure root DB is untouched)
        run: |
          # ルートのDBが変更されていないことを明示的に確認
          if git status --porcelain councils.db meti_shingikai.db | grep -q '.'; then
            echo "[!] WARNING: Root databases were modified during test!"
            git status --porcelain councils.db meti_shingikai.db
            exit 1
          else
            echo "[🎉 SUCCESS] Root environment is clean and safe."
          fi

      - name: Show Test Artifacts
        run: |
          if [ -f "test_scripts/test_councils.db" ]; then
            echo "[+] Test database found: test_scripts/test_councils.db"
            ls -lh test_scripts/test_councils.db
          fi

  test-impersonate:
    name: Test curl-cffi Impersonation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Setup Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install libcurl-dev
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Setup Lab (Install dependencies)
        working-directory: notebooklm-podcast-lab
        run: uv sync

      - name: "Debug: List Files"
        run: ls -R

      - name: Run Impersonate Scraper Test
        run: |
          # 指紋偽装版のスクレイパーを直接実行して検証
          uv run --project notebooklm-podcast-lab python3 test_scripts/scrape_meti_shingikai_impersonate.py

      - name: Verify Result
        run: |
          if [ -f "test_scripts/test_councils_impersonate.db" ]; then
            echo "[🎉 SUCCESS] Impersonate DB was generated successfully."
            ls -lh test_scripts/test_councils_impersonate.db
          else
            echo "[!] FAILED: Impersonate DB was not created."
            exit 1
          fi
