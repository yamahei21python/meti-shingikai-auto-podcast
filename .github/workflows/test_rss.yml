name: Test RSS Generation

on:
  workflow_dispatch:

jobs:
  test-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Setup Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install libcurl-dev (for curl-cffi)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Setup Dependencies
        working-directory: notebooklm-podcast-lab
        run: uv sync

      - name: Run upload_and_rss.py
        working-directory: notebooklm-podcast-lab
        run: |
          uv run python upload_and_rss.py 2>&1 | tee rss_output.log

      - name: Validate podcast.xml
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('podcast.xml')
          root = tree.getroot()
          items = root.findall('.//item')
          total = len(items)
          with_desc = 0
          no_desc_items = []
          for item in items:
              title = item.find('title').text if item.find('title') is not None else '(no title)'
              desc = item.find('description')
              if desc is not None and desc.text and desc.text.strip() and desc.text.strip() != 'No summary available.':
                  with_desc += 1
              else:
                  no_desc_items.append(title)
          print(f'Total items: {total}')
          print(f'Items with real description: {with_desc}')
          if no_desc_items:
              print(f'Items missing description:')
              for t in no_desc_items:
                  print(f'  - {t}')
          # Don't fail — DB-only items will have No summary available.
          # Just report the status.
          print('done')
          "

      - name: Upload podcast.xml as artifact
        uses: actions/upload-artifact@v4
        with:
          name: podcast-xml
          path: podcast.xml
