name: Daily METI & OCCTO Sync

on:
  schedule:
    - cron: '30 20 * * *' # 日本時間 05:30 (毎日)
  workflow_dispatch: # 手動実行用

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install cloudflare-warp -y

      - name: Connect WARP (Proxy Mode)
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status

      - name: Install uv and Setup Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install libcurl-dev (for curl-cffi)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Setup Dependencies
        working-directory: notebooklm-podcast-lab
        run: |
          uv sync
          uv run playwright install --with-deps chromium

      - name: Set NotebookLM Language to Japanese
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          # 認証ファイルを一時的に作成して言語を設定
          mkdir -p ~/.notebooklm
          echo "$NOTEBOOKLM_AUTH_JSON" > ~/.notebooklm/auth.json
          uv run --project notebooklm-podcast-lab notebooklm language set ja

      - name: Run Sync Pipeline
        run: |
          # 統合本番スクレイパーを実行
          uv run --project notebooklm-podcast-lab python3 notebooklm-podcast-lab/sync_all_production.py

      - name: Run Podcast Generation Worker (1 item per day - TEST)
        id: podcast_gen
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          # ポッドキャスト生成ワーカーを実行
          set -o pipefail
          uv run --project notebooklm-podcast-lab python3 notebooklm-podcast-lab/daily_podcast_worker.py 2>&1 | tee worker_output.log
          
          if grep -q "COMPLETE:" worker_output.log; then
            echo "has_asset=true" >> $GITHUB_OUTPUT
          else
            echo "has_asset=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload to R2 and Update RSS Feed
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          # R2へアップロードし、podcast.xmlを更新
          uv run --project notebooklm-podcast-lab python3 notebooklm-podcast-lab/upload_and_rss.py

      - name: Commit and Push Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 変更をステージング
          git add councils.db podcasts/*.md podcast.xml 2>/dev/null || true
          
          if git status --porcelain | grep -q '.'; then
            # ローカルでコミットを作成してからリベース
            git commit -m "chore: daily sync, podcast update, and R2 synchronization [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi

      - name: Create Release and Upload Assets
        if: steps.podcast_gen.outputs.has_asset == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "podcast-${{ github.run_number }}"
          name: "Daily Podcast [Run #${{ github.run_number }}]"
          body: "METI Council Audio Summary (Energy Industry Knowledge-up series)."
          files: |
            podcasts/*.mp3
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
