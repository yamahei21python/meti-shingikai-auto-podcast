name: Manual Scraping Test

on:
  workflow_dispatch:

jobs:
  test-scraping:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Setup Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install libcurl-dev (for curl-cffi)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Setup Dependencies
        working-directory: notebooklm-podcast-lab
        run: |
          uv sync
          uv run playwright install --with-deps chromium

      - name: Run curl-cffi Fetch Test
        run: |
          uv run --project notebooklm-podcast-lab python3 notebooklm-podcast-lab/test_fetch_curl_cffi.py

      - name: Run Sync Pipeline (Dry Run/Test)
        run: |
          uv run --project notebooklm-podcast-lab python3 notebooklm-podcast-lab/sync_all_production.py

      - name: Status Check
        run: |
          git status
          ls -lh councils.db
