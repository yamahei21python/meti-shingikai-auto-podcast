name: Daily METI Podcast Generator (Hybrid)

on:
  schedule:
    # 毎日 15:00 UTC (JST 24:00) に起動
    - cron: '0 15 * * *'
  push:
    paths:
      - 'councils.db' # DBが更新（プッシュ）された時にも自動起動
  workflow_dispatch: # 手動実行用

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release作成とCommit用

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Setup Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup NotebookLM Lab (Install dependencies)
        working-directory: notebooklm-podcast-lab
        run: |
          uv sync
          uv run playwright install --with-deps chromium

      - name: Run Podcast Worker (Process pending items)
        id: podcast_gen
        working-directory: notebooklm-podcast-lab
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          # DB内のpendingアイテムを検知してPodcastを生成
          set -o pipefail
          uv run python3 daily_podcast_worker.py 2>&1 | tee worker_output.log
          
          if grep -q "PODCAST_ASSET_PATH=" worker_output.log; then
            # Extract relative path to repo root
            raw_path=$(grep "PODCAST_ASSET_PATH=" worker_output.log | cut -d'=' -f2)
            filename=$(echo $raw_path | sed 's|^\.\./||')
            
            # Extract original source URL
            original_url=$(grep "ORIGINAL_URL=" worker_output.log | cut -d'=' -f2)
            
            echo "filename=$filename" >> $GITHUB_OUTPUT
            echo "original_url=$original_url" >> $GITHUB_OUTPUT
            echo "has_asset=true" >> $GITHUB_OUTPUT
          else
            echo "has_asset=false" >> $GITHUB_OUTPUT
          fi

      - name: Update RSS and Upload to R2
        if: steps.podcast_gen.outputs.has_asset == 'true'
        working-directory: notebooklm-podcast-lab
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          # アセットのアップロードとRSSフィードの更新
          # --file で新しく生成されたMP3を指定し、既存のpodcast.xmlに追記
          uv run python3 upload_and_rss.py \
            --file "../${{ steps.podcast_gen.outputs.filename }}" \
            --source_url "${{ steps.podcast_gen.outputs.original_url }}"

      - name: Commit and Push updates
        # 生成完了後の 'done' ステータス、更新されたRSS、およびスクリプト自身を保存
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Podcast generation and RSS update [skip ci]"
          file_pattern: 'councils.db podcast.xml notebooklm-podcast-lab/upload_and_rss.py'

      - name: Create Release and Upload Asset
        if: steps.podcast_gen.outputs.has_asset == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "podcast-${{ github.run_number }}"
          name: "Podcast [${{ steps.podcast_gen.outputs.filename }}]"
          body: "METI Council Audio Summary (Energy Industry Knowledge-up series)."
          files: |
            ${{ steps.podcast_gen.outputs.filename }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
